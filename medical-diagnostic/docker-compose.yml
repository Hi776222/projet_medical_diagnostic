version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8001
    depends_on:
      - mcp_server

  mcp_server:
    build:
      context: ./mcp_server
    ports:
      - "8001:8001"

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend